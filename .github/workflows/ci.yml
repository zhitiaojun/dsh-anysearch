name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci 会执行 prepare（node scripts/build.mjs），已覆盖 host+client 构建
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
